[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-rationalist-machine"
version = "0.0.1"
description = "Critical-Rationalist Machine (CRM) prototype: bold conjecture -> severe automated criticism -> retention of survivors and reasoned genealogy of failures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Heavy / phase-specific deps kept optional so `make smoke` stays light.
sig = [
    "sentence-transformers>=2.2",
]
report = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
crm-run = "crm.run:main"

[tool.setuptools]
packages = ["crm", "crm.critics", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
